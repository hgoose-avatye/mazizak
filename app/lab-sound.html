<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>사운드 A/B · 만지작 개발용</title>
    <style>
      body { position: static !important; overflow: auto !important; user-select: auto !important; -webkit-user-select: auto !important; padding: 14px 14px 60px; max-width: 640px; margin: 0 auto; line-height: 1.45; }
      h1 { font-size: 19px; margin: 4px 0; }
      h2 { font-size: 16px; margin: 22px 0 6px; }
      small, .muted { color: #6c645b; font-size: 12.5px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .col { background: #fff8; border-radius: 12px; padding: 8px; }
      .col h3 { margin: 0 0 6px; font-size: 13px; }
      button.pad { width: 100%; min-height: 48px; margin: 3px 0; border: 0; border-radius: 10px; background: #2a2724; color: #fff; font-size: 14px; touch-action: manipulation; }
      button.pad.b { background: #6b4a55; }
      button.pad:active { transform: scale(0.97); }
      .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
      .row button, select { font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid #0002; background: #fff; }
      .row button[aria-pressed='true'] { background: #2a2724; color: #fff; }
      #log { font: 11.5px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; background: #0000000d; padding: 8px; border-radius: 8px; }
      .warn { background: #fff4d0; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>사운드 A/B 비교 (개발용)</h1>
    <p class="muted">A = 기존 코드 합성음 · B = 실제 녹음 기반 샘플. 이어폰과 휴대폰 스피커 양쪽으로 들어보세요. 블라인드 모드에서는 A/B 위치가 무작위로 바뀌고, 선택 결과가 기록됩니다.</p>
    <div class="warn" id="status">불러오는 중…</div>
    <div class="row">
      <button id="blind" aria-pressed="false">블라인드 모드</button>
      <button id="export">결과 JSON 저장</button>
      <a href="./index.html">앱으로</a>
    </div>

    <h2>키보드</h2>
    <div class="row">
      프리셋 <select id="preset"><option value="pebble">조약돌</option><option value="clack">까랑까랑</option></select>
    </div>
    <div class="grid" id="kb"></div>

    <h2>말랑이</h2>
    <div class="grid" id="sq"></div>

    <h2>블라인드 선택</h2>
    <div class="row" id="vote" hidden>
      <span id="vote-q"></span>
      <button data-v="left">왼쪽이 더 자연스러움</button>
      <button data-v="right">오른쪽이 더 자연스러움</button>
      <button data-v="same">구분 안 됨</button>
    </div>
    <div id="log"></div>
    <script type="module" src="/src/lab/sound-ab.ts"></script>
  </body>
</html>
