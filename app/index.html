<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e9e4dd" />
    <meta name="description" content="만지작 — 손끝으로 만지는 실사형 3D 말랑이와 키보드. Touch. Squish. Relax." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="만지작" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <title>만지작 MANZIZAK</title>
  </head>
  <body>
    <!-- BRAND SPLASH: shown until the first toy is on screen (main.ts reveal()), never longer than a few seconds -->
    <div id="splash" aria-hidden="true">
      <div class="splash-mark"><span class="wordmark">만지작</span><span class="latin">MANZIZAK</span></div>
    </div>

    <div id="stage"></div>

    <header id="app-head" class="app-head">
      <h1 class="sr-only">만지작</h1>
      <div class="head-actions">
        <button class="icon-btn ghost" data-action="reset" hidden aria-label="처음 상태로">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3.8h3.8" /></svg>
        </button>
        <button class="icon-btn ghost" data-action="sound" id="sound-btn" aria-label="소리 끄기" aria-pressed="true"></button>
        <button class="icon-btn ghost" data-action="settings" aria-label="설정">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.9 4.6-.1-1.2 2-1.6-2-3.4-2.4.8c-.6-.5-1.3-.9-2-1.2L16 3h-4l-.4 2.5c-.7.3-1.4.7-2 1.2l-2.4-.8-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-.8c.6.5 1.3.9 2 1.2L12 21h4l.4-2.5c.7-.3 1.4-.7 2-1.2l2.4.8 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z" transform="translate(-2 0)"/></svg>
        </button>
      </div>
    </header>

    <div class="now-playing" id="now-playing" aria-live="polite" aria-atomic="true">
      <span class="now-category blank" id="now-category"></span>
      <h2 id="now-name">슬랑이</h2>
    </div>

    <!-- per-toy controls that are not toy choices: 말랑이(squishy) colours, dev-only sound A/B chips -->
    <div class="variants" id="variants" role="radiogroup"></div>

    <!-- TOY PICKER DOCK -->
    <nav id="dock" class="dock" aria-label="장난감 선택">
      <button class="dock-toggle" id="dock-toggle" aria-expanded="true" aria-controls="dock-body" aria-label="장난감 목록 접기">

        <span class="dock-label"><span class="collection-dot" aria-hidden="true"></span>장난감 서랍</span>
        <span class="dock-toggle-meta"><span class="dock-current" id="dock-current"></span><span id="dock-toggle-label">접기</span><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 9.5l6 6 6-6" /></svg></span>
      </button>
      <div class="dock-body" id="dock-body">
        <div class="dock-toolbar">
        <div class="cat-seg" role="radiogroup" aria-label="카테고리">
          <button role="radio" data-category="fidget" aria-checked="true">말랑이</button><button role="radio" data-category="keyboard" aria-checked="false">키보드</button>
        </div>
        <span class="collection-count" id="collection-count" aria-live="polite"></span>
        </div>
        <div class="toy-list" id="toy-list" role="radiogroup" aria-label="장난감"></div>
      </div>
    </nav>

    <!-- SETTINGS SHEET -->
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-backdrop" data-action="close-sheet"></div>
      <section class="sheet-panel" role="dialog" aria-modal="true" aria-label="설정">
        <div class="sheet-grip"></div>
        <div class="sheet-top"><div><span class="eyebrow">MAKE IT YOURS</span><h2>설정</h2></div><button class="sheet-close icon-btn" data-action="close-sheet" aria-label="설정 닫기"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
        <p class="setting-group">사운드와 터치</p>
        <label class="row"><span>소리</span><input type="checkbox" role="switch" data-setting="sound" /></label>
        <label class="row"><span>볼륨</span><span class="range-wrap"><input id="volume-control" type="range" min="0" max="1" step="0.01" data-setting="volume" /><output id="volume-value" for="volume-control">90%</output></span></label>
        <label class="row" id="row-haptics"><span>진동 <small id="haptics-note"></small></span><input type="checkbox" role="switch" data-setting="haptics" /></label>
        <p class="setting-group">화면과 움직임</p>
        <div class="row">
          <span>화질</span>
          <div class="seg" data-setting="quality">
            <button data-v="auto">자동</button><button data-v="high">고화질</button><button data-v="saver">절약</button>
          </div>
        </div>
        <label class="row"><span>움직임 줄이기</span><input type="checkbox" role="switch" data-setting="reduceMotion" /></label>
        <label class="row"><span>성능 정보 표시</span><input type="checkbox" role="switch" data-setting="showStats" /></label>
        <button class="primary" data-action="close-sheet">완료</button>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
